<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f9f0"/>
  
  <!-- 扫码框 -->
  <rect x="50" y="60" width="100" height="100" fill="none" stroke="#a0e0a3" stroke-width="3" rx="5"/>
  <rect x="50" y="60" width="20" height="20" fill="none" stroke="#a0e0a3" stroke-width="4" stroke-dasharray="5,5"/>
  
  <!-- 条码线条 -->
  <line x1="70" y1="90" x2="130" y2="90" stroke="#a0e0a3" stroke-width="2"/>
  <line x1="70" y1="100" x2="120" y2="100" stroke="#a0e0a3" stroke-width="2"/>
  <line x1="70" y1="110" x2="130" y2="110" stroke="#a0e0a3" stroke-width="2"/>
  <line x1="70" y1="120" x2="110" y2="120" stroke="#a0e0a3" stroke-width="2"/>
  <line x1="70" y1="130" x2="130" y2="130" stroke="#a0e0a3" stroke-width="2"/>
  
  <!-- 手机轮廓 -->
  <rect x="75" y="40" width="50" height="140" fill="none" stroke="#999" stroke-width="2" rx="8"/>
  <circle cx="100" cy="170" r="5" fill="#999"/>
</svg>
